<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ProjectHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="logo" href="index.html">ProjectHub</a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a class="active" href="signin.html">Sign In</a></li>
        <li><a class="nav-button" href="submit.html">Submit Work</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-page">
    <section class="form-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to ProjectHub</h1>
      <p class="form-intro">Sign in to manage your profile and submit your own projects.</p>
      <form id="signInForm" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required>
          <small class="error" id="emailError"></small>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
          <small class="error" id="passwordError"></small>
        </div>
        <button class="button primary full-width" type="submit">Sign In</button>
        <p class="form-message" id="signInMessage"></p>
      </form>
      <p class="form-note">Demo site: this form does not store real account information.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div><strong>ProjectHub</strong><p>A simple student work archive.</p></div>
      <p>© 2026 ProjectHub.</p>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
