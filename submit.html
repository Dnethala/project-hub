<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Work | ProjectHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="logo" href="index.html">ProjectHub</a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="signin.html">Sign In</a></li>
        <li><a class="nav-button active" href="submit.html">Submit Work</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Share Your Work</p>
        <h1>Submit a Project</h1>
        <p>Fill out the form below to showcase your course project or side build on ProjectHub.</p>
      </div>
    </section>

    <section class="section container">
      <div class="form-container">
        <form id="submitForm">
          <div class="form-group">
            <label for="projectTitle">Project Title</label>
            <input type="text" id="projectTitle" placeholder="e.g. StudyTrack" required>
          </div>

          <div class="form-group">
            <label for="creatorName">Your Name</label>
            <input type="text" id="creatorName" placeholder="e.g. Alex M." required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select a category...</option>
              <option value="Technology">Technology</option>
              <option value="Art">Art</option>
              <option value="Writing">Writing</option>
              <option value="Design">Design</option>
            </select>
          </div>

          <div class="form-group">
            <label for="projectLink">Project Link (GitHub, Figma, Demo)</label>
            <input type="url" id="projectLink" placeholder="https://github.com/your-username/project-repo">
          </div>

          <div class="form-group">
            <label for="projectFile">Upload Project File or Screenshot</label>
            <input type="file" id="projectFile" accept="image/*,.pdf,.zip">
          </div>

          <div class="form-group">
            <label for="description">Project Description</label>
            <textarea id="description" rows="5" placeholder="Briefly describe what you created..." required></textarea>
          </div>

          <button type="submit" class="button primary">Submit Project</button>
          <p id="submitMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div><strong>ProjectHub</strong><p>A simple student work archive.</p></div>
      <p>© 2026 ProjectHub.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
